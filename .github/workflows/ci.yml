name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Whitespace check across the tree
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv build
      - name: Wheel-only smoke test
        # Dry-run bootstrap and routine planning must never touch the runner's real data home.
        run: |
          export HMR_HOME="$RUNNER_TEMP/hmr-store" HERMES_HOME="$RUNNER_TEMP/hermes-home"
          uv venv "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" dist/*.whl
          "$RUNNER_TEMP/wheel-venv/bin/hmr" --version
          "$RUNNER_TEMP/wheel-venv/bin/hmr" hermes bootstrap
          "$RUNNER_TEMP/wheel-venv/bin/hmr" hermes routines
