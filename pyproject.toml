[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medical-deep-research-plugin"
version = "0.3.1"
description = "Headless evidence-based medical research for Codex, Claude Code, and Hermes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Junhewk" }]
dependencies = ["httpx>=0.27,<1", "pdfminer.six>=20240706", "markdown-it-py>=3,<5", "defusedxml>=0.7,<1", "filelock>=3.15,<4"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.scripts]
medical-deep-research-plugin = "medical_deep_research_plugin.cli:main"
hermes-medical-search = "hermes_medical_search.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "jsonschema>=4", "pyyaml>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_medical_search", "src/medical_deep_research_plugin"]

[tool.hatch.build.targets.sdist]
include = ["src", "skills", "scripts", "examples", "tests", ".codex-plugin", ".claude-plugin", "plugin.json", "README.md", "LICENSE", "CHANGELOG.md", "VALIDATION.md", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
