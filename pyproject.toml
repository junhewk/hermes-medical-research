[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-medical-research"
version = "0.5.4"
description = "Deterministic medical evidence workflows for isolated Hermes bots"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Junhewk" }]
dependencies = ["httpx>=0.27,<1", "pdfminer.six>=20240706", "markdown-it-py>=3,<5", "defusedxml>=0.7,<1", "filelock>=3.15,<4", "pyyaml>=6"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.scripts]
mdr = "hermes_medical_research.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "jsonschema>=4"]

[tool.hatch.build]
exclude = ["/.board", "/.hermes-test-*", "/.venv", "/dist", "/.pytest_cache", "/.ruff_cache"]

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_medical_research"]

[tool.hatch.build.targets.sdist]
include = ["src", "skills", "scripts", "examples", "tests", "docs", "CONTEXT.md", "README.md", "LICENSE", "CHANGELOG.md", "VALIDATION.md", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
